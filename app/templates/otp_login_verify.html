<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PREPER - Verify Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @font-face {
      font-family: "BwGradual-Black";
      src: url("data:font/woff2;base64,");
    }

    @font-face {
      font-family: "BwGradual-Bold";
      src: url("data:font/woff2;base64,");
    }

    @font-face {
      font-family: "BwGradual-Medium";
      src: url("data:font/woff2;base64,");
    }

    @font-face {
      font-family: "BwGradual-Regular";
      src: url("data:font/woff2;base64,");
    }

    @font-face {
      font-family: "BwGradual-Light";
      src: url("data:font/woff2;base64,");
    }

    :root {
      --purple: #9685fe;
      --black: #000;
      --white: #fff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--black);
      color: var(--white);
      font-family: 'BwGradual-Regular', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }

    *::selection {
      background-color: var(--purple);
      color: white;
    }

    .glow-effect {
      animation: glow 3s ease-in-out infinite;
    }

    @keyframes glow {

      0%,
      100% {
        opacity: 0.3;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(1.1);
      }
    }

    .gradient-text {
      background: linear-gradient(135deg, var(--purple) 0%, #7c4dff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .input-glow:focus {
      box-shadow: 0 0 20px rgba(150, 133, 254, 0.3);
    }

    .signup-card {
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .signup-card:hover {
      box-shadow: 0 20px 40px rgba(150, 133, 254, 0.2);
    }

    .slide-in {
      animation: slideIn 0.6s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div
    class="min-h-screen relative overflow-hidden bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-gray-900 via-[#0a0a0a] to-black flex items-center justify-center">
    <!-- Animated Background -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
      <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-[var(--purple)]/20 rounded-full blur-[150px] glow-effect">
      </div>
      <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-[var(--purple)]/20 rounded-full blur-[150px] glow-effect"
        style="animation-delay: 1.5s;"></div>
    </div>

    <!-- Background Grid Effect -->
    <div class="absolute inset-0 z-0 opacity-20"
      style="background-image: linear-gradient(#2a2a2a 1px, transparent 1px), linear-gradient(90deg, #2a2a2a 1px, transparent 1px); background-size: 40px 40px;">
    </div>

    <!-- Main Content -->
    <div class="relative z-10 w-full max-w-md px-4">
      <div
        class="signup-card bg-[#0a0a0a] rounded-2xl sm:rounded-3xl p-6 sm:p-8 border border-white/10 relative overflow-hidden slide-in">
        <!-- Grainy texture overlay -->
        <div class="absolute inset-0 opacity-5 pointer-events-none"
          style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 400 400%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.9%22 numOctaves=%224%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');">
        </div>

        <div class="relative z-10">
          <div class="text-center mb-8">
            <h2 class="text-2xl sm:text-3xl font-bold mb-2" style="font-family: 'BwGradual-Bold', sans-serif;">Verify
              Login</h2>
            <p class="text-gray-400 text-sm sm:text-base">Enter the code sent to your email<br><span
                class="text-[var(--purple)]">{{ email }}</span>
            </p>
          </div>

          <!-- Flash Messages -->
          {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
          {% for category, message in messages %}
          <div
            class="mb-4 p-4 rounded-xl {% if category == 'success' %}bg-green-500/10 border border-green-500/20 text-green-400{% elif category == 'danger' %}bg-red-500/10 border border-red-500/20 text-red-400{% elif category == 'warning' %}bg-yellow-500/10 border border-yellow-500/20 text-yellow-400{% else %}bg-blue-500/10 border border-blue-500/20 text-blue-400{% endif %}">
            {{ message }}
          </div>
          {% endfor %}
          {% endif %}
          {% endwith %}

          <form class="space-y-6" method="POST" action="{{ url_for('auth.verify_otp') }}">
            <div>
              <label class="block text-xs sm:text-sm font-medium mb-2 text-gray-300" for="otp">Enter Verification
                Code</label>
              <input type="text" id="otp" name="otp" required maxlength="6" pattern="[0-9]{6}"
                class="input-glow w-full px-3 sm:px-4 py-3 sm:py-4 bg-black/50 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-[var(--purple)]/50 transition-all duration-300 text-center text-xl tracking-[0.5em] font-mono"
                placeholder="000000" autocomplete="one-time-code" />
            </div>

            <button type="submit"
              class="w-full bg-white text-black py-3 sm:py-4 rounded-full font-semibold hover:bg-gray-200 transition-all duration-300 transform hover:scale-105 hover:shadow-[0_0_30px_rgba(255,255,255,0.3)] flex items-center justify-center gap-2 text-sm sm:text-base"
              style="font-family: 'BwGradual-Medium', sans-serif;">
              Verify & Login
              <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3">
                </path>
              </svg>
            </button>
          </form>

          <div class="text-center mt-6">
            <form action="{{ url_for('auth.resend_otp') }}" method="POST" class="inline">
              <button type="submit" class="text-gray-400 text-sm hover:text-white transition-colors">
                Didn't receive code? <span class="text-[var(--purple)] hover:underline font-medium">Resend</span>
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
