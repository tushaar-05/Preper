<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PREPER - 404 Page Not Found</title>
  <link rel="icon" type="image/png" href="../static/images/android-chrome-192x192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --purple: #9685fe;
      --black: #000;
      --white: #fff;
    }

    body {
      background-color: var(--black);
      color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    .glow-effect {
      animation: glow 3s ease-in-out infinite;
    }

    @keyframes glow {

      0%,
      100% {
        opacity: 0.3;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(1.1);
      }
    }

    .floating-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      animation: float 20s ease-in-out infinite;
      z-index: -1;
    }

    @keyframes float {

      0%,
      100% {
        transform: translate(0, 0);
      }

      33% {
        transform: translate(30px, -30px);
      }

      66% {
        transform: translate(-20px, 20px);
      }
    }

    .gradient-text {
      background: linear-gradient(135deg, var(--purple) 0%, #7c4dff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center relative">
  <!-- Animated Background -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="floating-orb top-1/4 left-1/4 w-96 h-96 bg-[var(--purple)]/20 glow-effect"></div>
    <div class="floating-orb bottom-1/4 right-1/4 w-96 h-96 bg-[var(--purple)]/20 glow-effect"
      style="animation-delay: 1.5s;"></div>
  </div>

  <div class="text-center px-4 relative z-10">
    <h1 class="text-9xl font-bold mb-4 gradient-text">404</h1>
    <h2 class="text-3xl md:text-4xl font-semibold mb-6">Lost in Space?</h2>
    <p class="text-gray-400 text-lg mb-10 max-w-md mx-auto">
      The page you are looking for has vanished or never existed. Don't worry, your progress is still safe.
    </p>
    <a href="/"
      class="inline-block px-10 py-4 bg-white text-black rounded-full font-bold hover:bg-gray-200 transition-all duration-300 hover:scale-105 shadow-[0_0_30px_rgba(255,255,255,0.2)]">
      Back to Reality
    </a>
  </div>

  <!-- Background Grid Effect -->
  <div class="absolute inset-0 z-0 opacity-10"
    style="background-image: linear-gradient(#2a2a2a 1px, transparent 1px), linear-gradient(90deg, #2a2a2a 1px, transparent 1px); background-size: 40px 40px;">
  </div>
</body>

</html>
