<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PREPER - Reset Password</title>
  <link rel="icon" type="image/png" href="../static/images/android-chrome-192x192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @font-face {
      font-family: "BwGradual-Black";
      src: url("data:font/woff2;base64,");
    }

    @font-face {
      font-family: "BwGradual-Bold";
      src: url("data:font/woff2;base64,");
    }

    @font-face {
      font-family: "BwGradual-Medium";
      src: url("data:font/woff2;base64,");
    }

    @font-face {
      font-family: "BwGradual-Regular";
      src: url("data:font/woff2;base64,");
    }

    :root {
      --purple: #9685fe;
      --black: #000;
      --white: #fff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--black);
      color: var(--white);
      font-family: 'BwGradual-Regular', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }

    .glow-effect {
      animation: glow 3s ease-in-out infinite;
    }

    @keyframes glow {

      0%,
      100% {
        opacity: 0.3;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(1.1);
      }
    }

    .input-glow:focus {
      box-shadow: 0 0 20px rgba(150, 133, 254, 0.3);
    }

    .login-card {
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .login-card:hover {
      box-shadow: 0 20px 40px rgba(150, 133, 254, 0.2);
    }

    .slide-in {
      animation: slideIn 0.6s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .floating-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      animation: float 20s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translate(0, 0);
      }

      33% {
        transform: translate(30px, -30px);
      }

      66% {
        transform: translate(-20px, 20px);
      }
    }
  </style>
</head>

<body>
  <div
    class="min-h-screen relative overflow-hidden bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-gray-900 via-[#0a0a0a] to-black">
    <!-- Animated Background -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
      <div class="floating-orb top-1/4 left-1/4 w-96 h-96 bg-[var(--purple)]/20 glow-effect"></div>
      <div class="floating-orb bottom-1/4 right-1/4 w-96 h-96 bg-[var(--purple)]/20 glow-effect"
        style="animation-delay: 1.5s;"></div>
    </div>

    <!-- Main Content -->
    <div class="relative z-10 flex min-h-screen items-center justify-center px-4 py-12">
      <div class="w-full max-w-md">

        <div class="text-center mb-8 slide-in">
          <a href="/" class="text-3xl font-bold inline-block"
            style="font-family: 'BwGradual-Bold', sans-serif;">PREPER</a>
        </div>

        <div class="slide-in" style="animation-delay: 0.1s;">
          <div class="login-card bg-[#0a0a0a] rounded-3xl p-8 border border-white/10 relative overflow-hidden">
            <!-- Grainy texture overlay -->
            <div class="absolute inset-0 opacity-5 pointer-events-none"
              style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 400 400%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.9%22 numOctaves=%224%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');">
            </div>

            <div class="relative z-10">
              <h2 class="text-2xl font-bold mb-2" style="font-family: 'BwGradual-Bold', sans-serif;">Reset Password</h2>
              <p class="text-gray-400 mb-8 text-sm">Please enter your new password below.</p>

              <!-- Flash Messages -->
              {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
              {% for category, message in messages %}
              <div
                class="mb-4 p-4 rounded-xl {% if category == 'success' %}bg-green-500/10 border border-green-500/20 text-green-400{% elif category == 'danger' %}bg-red-500/10 border border-red-500/20 text-red-400{% elif category == 'warning' %}bg-yellow-500/10 border border-yellow-500/20 text-yellow-400{% else %}bg-blue-500/10 border border-blue-500/20 text-blue-400{% endif %}">
                {{ message }}
              </div>
              {% endfor %}
              {% endif %}
              {% endwith %}

              <form class="space-y-5" method="POST">
                <div>
                  <label class="block text-sm font-medium mb-2 text-gray-300" for="password">New Password</label>
                  <input type="password" id="password" name="password" required minlength="6"
                    class="input-glow w-full px-4 py-3 bg-black/50 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-[var(--purple)]/50 transition-all duration-300"
                    placeholder="••••••••••" />
                </div>

                <div>
                  <label class="block text-sm font-medium mb-2 text-gray-300" for="confirm_password">Confirm
                    Password</label>
                  <input type="password" id="confirm_password" name="confirm_password" required minlength="6"
                    class="input-glow w-full px-4 py-3 bg-black/50 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-[var(--purple)]/50 transition-all duration-300"
                    placeholder="••••••••••" />
                </div>

                <button type="submit"
                  class="w-full bg-white text-black py-4 rounded-full font-semibold hover:bg-gray-200 transition-all duration-300 transform hover:shadow-[0_0_30px_rgba(255,255,255,0.3)]"
                  style="font-family: 'BwGradual-Medium', sans-serif;">
                  Reset Password
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
